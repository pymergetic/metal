{% args title, rows %}
{% include "base_header.html" title %}
<h1>externals</h1>
<p class="muted">Third-party stack identity from <code>pymergetic.metal.externals</code>.</p>
<table>
  <tr><th>id</th><th>version</th><th>note</th></tr>
  {% for r in rows %}
  <tr>
    <td><a href="/externals/{{ r["id"] }}"><code>{{ r["id"] }}</code></a></td>
    <td>{{ r["version"] }}</td>
    <td>{{ r["note"] }}</td>
  </tr>
  {% endfor %}
</table>
{% include "base_footer.html" %}
