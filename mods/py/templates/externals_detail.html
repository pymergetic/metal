{% args title, row %}
{% include "base_header.html" title %}
<p class="nav-crumbs"><a href="/externals">externals</a> / <code>{{ row["id"] }}</code></p>
<h1>{{ row["id"] }}</h1>
<p class="muted">version {{ row["version"] }}</p>
{% if row["url"] %}
<p><a href="{{ row["url"] }}">{{ row["url"] }}</a></p>
{% endif %}
{% if row["note"] %}
<pre>{{ row["note"] }}</pre>
{% endif %}
{% include "base_footer.html" %}
