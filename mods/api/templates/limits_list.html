{% args title, rows %}
{% include "base_header.html" title %}
<h1>limits</h1>
<p class="muted">Compile-time memory/buffer budgets from <code>pymergetic.metal.mem.limit</code>.</p>
<table>
  <tr><th>id</th><th>value</th><th>unit</th><th>note</th></tr>
  {% for r in rows %}
  <tr>
    <td><a href="/limits/{{ r["id"] }}"><code>{{ r["id"] }}</code></a></td>
    <td>{{ r["value"] }}</td>
    <td>{{ r["unit"] }}</td>
    <td>{{ r["note"] }}</td>
  </tr>
  {% endfor %}
</table>
{% include "base_footer.html" %}
