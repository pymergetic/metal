# Product freestanding Rust workspace (wasmmod-shaped crates/, not forge .pm).
[workspace]
resolver = "2"
members = [
    "crates/pymergetic_metal_rt",
    "crates/pymergetic_metal_async",
    "crates/pymergetic_metal_fs_vfs",
    "crates/pymergetic_metal_fs",
    "crates/pymergetic_metal_fs_tmpfs",
    "crates/pymergetic_metal_fs_wasmmod",
    "crates/pymergetic_metal_util_lz4",
    "crates/pymergetic_metal_util_tar",
    "crates/pymergetic_metal_util_size",
    "crates/pymergetic_metal_fs_mtar",
    "crates/pymergetic_metal_dt",
    "crates/pymergetic_metal_log",
    "crates/pymergetic_metal_mem_lock",
    "crates/pymergetic_metal_mem_arena",
    "crates/pymergetic_metal_mem_tlsf",
    "crates/pymergetic_metal_mem",
    "crates/pymergetic_metal_reg",
    "crates/pymergetic_metal_net_ssh",
    "crates/pymergetic_metal_fs_embed",
    "crates/pymergetic_metal_fs_zip",
    "crates/pymergetic_metal_dev_blk_ram",
    "crates/pymergetic_metal_fs_fat",
    "crates/pymergetic_metal_fs_overlay",
    "crates/pymergetic_metal_fs_littlefs",
    "crates/pymergetic_metal_hwtree",
    "crates/pymergetic_metal_wamr_host",
    "crates/pymergetic_metal_rs",
    "crates/pymergetic_metal_browser_rs",
]

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
opt-level = "s"
