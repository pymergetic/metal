[package]
name = "pymergetic_metal_forge"
version = "0.1.0"
edition = "2021"

[lib]
path = "../__init__.rs"
crate-type = ["rlib"]

[features]
default = []
# Linux FS/stdio port shim (always-Ready). App is tools/forge-cli, not this crate.
solo = []
# Later: Metal process + console session (may Pending). Not linked into EFI yet.
metal = []

# Zero crates.io deps — keep empty.
[dependencies]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
