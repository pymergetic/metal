[package]
name = "pymergetic_metal_async"
version = "0.1.0"
edition = "2021"

[lib]
path = "../_crate.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
pymergetic_metal_rt = { path = "../../rt/.pm" }
pymergetic_metal_mem = { path = "../../mem/.pm" }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
