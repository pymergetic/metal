[package]
name = "pymergetic_metal_reg"
version = "0.1.0"
edition = "2021"

[lib]
path = "../_impl/__init__.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "smoke"
path = "smoke.rs"

[dependencies]
pymergetic_metal_rt = { path = "../../rt/.pm" }
# Not a bare Cargo call: `_kernel.rs` still only calls through the
# generated fast-path face (`#[path]`, see docs/definitions/module.md
# "Consume foreign modules"). This entry exists purely so `reg`'s own
# standalone smoke binary links `async`'s object code -- `boot`'s real
# link already pulls it in for the firmware build regardless.
pymergetic_metal_async = { path = "../../async/.pm" }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
