[package]
name = "pymergetic_metal_boot"
version = "0.1.0"
edition = "2021"

[lib]
path = "../_impl/__init__.rs"
crate-type = ["staticlib", "rlib"]

# Empty-boot skeleton (`registration_rethink` plan, Phase A): floor deps
# only. Product deps (fs/net/py/wasm/reg/hwtree/tar/lz4/size) are disabled
# here, not deleted from the tree — revive module by module in later
# phases. `async` stays: `async/time.rs` owns `pm_metal_time_init` /
# `pm_metal_time_recalibrate` (TSC calibrate), needed by the floor even
# though the run loop / runners are not started. `exp2_stress` feature
# removed with net.ntp; stress is disabled from the default build until
# Phase E.
[dependencies]
# Kernel namespace root: module #0, loaded first in `_bootstrap.rs`'s
# `reg_bootstrap` via its generated fast-path face. Pulled in as a Cargo
# dependency purely so the linker resolves `pm_metal_kernel_load` -- the
# call site itself goes through `include/pymergetic/metal/__init__.rs`,
# never a direct `pymergetic_metal::` Rust call (see
# docs/definitions/module.md "Consume foreign modules").
pymergetic_metal = { path = "../../.pm" }
pymergetic_metal_rt = { path = "../../rt/.pm" }
pymergetic_metal_mem = { path = "../../mem/.pm" }
pymergetic_metal_dt = { path = "../../dt/.pm" }
pymergetic_metal_console = { path = "../../console/.pm" }
pymergetic_metal_dev_serial = { path = "../../dev/serial/.pm" }
pymergetic_metal_log = { path = "../../log/.pm" }
pymergetic_metal_util_ascii = { path = "../../util/ascii/.pm" }
pymergetic_metal_bus_pci = { path = "../../bus/pci/.pm" }
pymergetic_metal_dev_time = { path = "../../dev/time/.pm" }
pymergetic_metal_dev_acpi = { path = "../../dev/acpi/.pm" }
pymergetic_metal_dev_random = { path = "../../dev/random/.pm" }
pymergetic_metal_dev_input = { path = "../../dev/input/.pm" }
pymergetic_metal_dev_gfx = { path = "../../dev/gfx/.pm" }
pymergetic_metal_async = { path = "../../async/.pm" }
# `reg` itself: no floor module calls its C ABI directly anymore (every
# statically-linked peer is a plain Cargo dependency now), but `rt` still
# calls `pm_metal_reg_register` via a raw `extern "C"` decl (`rt` can't
# Cargo-depend on `reg` without a cycle) to register halt/panic/panic_at
# for late/unloadable callers (wasm, Python). `boot` is the final link
# unit, so it pulls `reg`'s object code in for that symbol to resolve.
pymergetic_metal_reg = { path = "../../reg/.pm" }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
