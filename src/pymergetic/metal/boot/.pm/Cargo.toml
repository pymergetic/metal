[package]
name = "pymergetic_metal_boot"
version = "0.1.0"
edition = "2021"

[lib]
path = "../_impl/__init__.rs"
crate-type = ["staticlib", "rlib"]

[features]
# forge build --stress: point net.ntp at the host mock port.
exp2_stress = ["pymergetic_metal_net_ntp/exp2_stress"]

[dependencies]
# Kernel namespace root: module #0, loaded first in `_bootstrap.rs`.
pymergetic_metal = { path = "../../.pm" }
pymergetic_metal_rt = { path = "../../rt/.pm" }
pymergetic_metal_mem = { path = "../../mem/.pm" }
pymergetic_metal_dt = { path = "../../dt/.pm" }
pymergetic_metal_console = { path = "../../console/.pm" }
pymergetic_metal_dev_serial = { path = "../../dev/serial/.pm" }
pymergetic_metal_log = { path = "../../log/.pm" }
pymergetic_metal_shell = { path = "../../shell/.pm" }
pymergetic_metal_util_ascii = { path = "../../util/ascii/.pm" }
pymergetic_metal_util_size = { path = "../../util/size/.pm" }
pymergetic_metal_util_tar = { path = "../../util/tar/.pm" }
pymergetic_metal_util_lz4 = { path = "../../util/lz4/.pm" }
pymergetic_metal_bus_pci = { path = "../../bus/pci/.pm" }
pymergetic_metal_dev_time = { path = "../../dev/time/.pm" }
pymergetic_metal_dev_acpi = { path = "../../dev/acpi/.pm" }
pymergetic_metal_dev_random = { path = "../../dev/random/.pm" }
pymergetic_metal_dev_input = { path = "../../dev/input/.pm" }
pymergetic_metal_dev_gfx = { path = "../../dev/gfx/.pm" }
pymergetic_metal_dev_audio = { path = "../../dev/audio/.pm" }
pymergetic_metal_hwtree = { path = "../../hwtree/.pm" }
pymergetic_metal_async = { path = "../../async/.pm" }
pymergetic_metal_fs_vfs = { path = "../../fs/vfs/.pm" }
pymergetic_metal_fs = { path = "../../fs/.pm" }
pymergetic_metal_fs_fat = { path = "../../fs/fat/.pm" }
pymergetic_metal_fs_mtar = { path = "../../fs/mtar/.pm" }
pymergetic_metal_fs_littlefs = { path = "../../fs/littlefs/.pm" }
pymergetic_metal_fs_tmpfs = { path = "../../fs/tmpfs/.pm" }
pymergetic_metal_dev_blk_ram = { path = "../../dev/blk/ram/.pm" }
pymergetic_metal_net_ip = { path = "../../net/ip/.pm" }
pymergetic_metal_net_dns = { path = "../../net/dns/.pm" }
pymergetic_metal_net_ip_tcp = { path = "../../net/ip/tcp/.pm" }
pymergetic_metal_net_ip_udp = { path = "../../net/ip/udp/.pm" }
pymergetic_metal_net_ip_icmp = { path = "../../net/ip/icmp/.pm" }
pymergetic_metal_net_ntp = { path = "../../net/ntp/.pm" }
pymergetic_metal_net_http = { path = "../../net/http/.pm" }
pymergetic_metal_net_http_microdot = { path = "../../net/http/microdot/.pm" }
pymergetic_metal_net_tftp = { path = "../../net/tftp/.pm" }
pymergetic_metal_net_ftp = { path = "../../net/ftp/.pm" }
pymergetic_metal_net_ssh = { path = "../../net/ssh/.pm" }
pymergetic_metal_reg = { path = "../../reg/.pm" }
pymergetic_metal_py = { path = "../../py/.pm" }
pymergetic_metal_wasm = { path = "../../wasm/.pm" }
pymergetic_metal_forge = { path = "../../forge/.pm", features = ["metal"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
