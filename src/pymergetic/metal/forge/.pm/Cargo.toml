[package]
name = "pymergetic_metal_forge"
version = "0.1.0"
edition = "2021"

[lib]
path = "../__init__.rs"
crate-type = ["rlib"]

[features]
default = []
# Linux FS/stdio port shim (always-Ready). App is ./forge-cli, not this crate.
solo = []
# Image builders (mtar/fat/zip/embed) — pulls Metal FS crates. Host tool only.
builders = [
  "solo",
  "dep:pymergetic_metal_fs_mtar",
  "dep:pymergetic_metal_fs_fat",
  "dep:pymergetic_metal_fs_zip",
  "dep:pymergetic_metal_fs_embed",
  "dep:pymergetic_metal_fs_littlefs",
  "dep:pymergetic_metal_dev_blk_ram",
  "dep:pymergetic_metal_async",
  "dep:pymergetic_metal_util_lz4",
  "dep:pymergetic_metal_util_tar",
  "dep:pymergetic_metal_fs",
  "dep:pymergetic_metal_fs_vfs",
]
# Metal process/console port stubs + in-kernel render (linked via boot).
metal = []

# Zero crates.io deps — Metal path deps only under `builders`.
[dependencies]
pymergetic_metal_fs_mtar = { path = "../../fs/mtar/.pm", optional = true }
pymergetic_metal_fs_fat = { path = "../../fs/fat/.pm", optional = true }
pymergetic_metal_fs_zip = { path = "../../fs/zip/.pm", optional = true }
pymergetic_metal_fs_embed = { path = "../../fs/embed/.pm", optional = true }
pymergetic_metal_fs_littlefs = { path = "../../fs/littlefs/.pm", optional = true }
pymergetic_metal_dev_blk_ram = { path = "../../dev/blk/ram/.pm", optional = true }
pymergetic_metal_async = { path = "../../async/.pm", optional = true }
pymergetic_metal_util_lz4 = { path = "../../util/lz4/.pm", optional = true }
pymergetic_metal_util_tar = { path = "../../util/tar/.pm", optional = true }
pymergetic_metal_fs = { path = "../../fs/.pm", optional = true }
pymergetic_metal_fs_vfs = { path = "../../fs/vfs/.pm", optional = true }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
