[package]
name = "forge"
version = "0.1.0"
edition = "2021"
# Hidden nested crate under pymergetic.metal.forge — Linux solo app only.

[[bin]]
name = "forge"
path = "../main.rs"

[dependencies]
pymergetic_metal_forge = { path = "../../.pm", features = ["solo", "builders"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
