[package]
name = "pymergetic_metal_rt"
version = "0.1.0"
edition = "2021"
description = "Freestanding Metal rt — panic/halt + GlobalAlloc → pm_metal_mem_*"
publish = false

[lib]
path = "../../src/pymergetic/metal/rt/__init__.rs"
# rlib only — product links one umbrella staticlib (pymergetic_metal_rs).
crate-type = ["rlib"]

[features]
default = []
# Emit pm_metal_rt_* no_mangle faces. Enable from the product umbrella
# staticlib (pymergetic_metal_rs). Browser umbrella omits this so C
# rt_block.c owns the ABI without wasm-ld signature clashes.
export_c_abi = []
# Wire when product links pymergetic.metal.reg.
reg = []
